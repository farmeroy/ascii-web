# test everything on every push and pull request; on master, also publish the
# examples to GitHub Pages
#
# actions are pinned to full commit SHAs (version in the comment): a tag can be
# moved to different code, a commit can't. Dependabot keeps the pins updated.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# no access by default; each job is granted only what it needs
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # a newer push to the same branch cancels the run it replaces
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # don't leave the job's token in .git/config for later steps to read
          persist-credentials: false

      # Rust, the wasm target and wasm-pack, to build packages/wasm/pkg
      # (gitignored, so CI builds it like you do locally)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/wasm
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-pack

      # pnpm at the version in package.json's packageManager field
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Rust tests
        run: cargo test --lib
        working-directory: packages/wasm

      # wasm, then client and server (tsc, so this also type-checks them)
      - run: pnpm build

      - name: Playwright tests
        run: |
          pnpm exec playwright install --with-deps
          pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # built on pull requests too, so a broken examples build fails the PR
      - run: pnpm build:examples
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: dist-examples

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # never cancel a deploy halfway; a newer one waits its turn
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
