<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infinite scroll · ascii-web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono&family=Ubuntu+Mono&display=swap" />
    <link rel="stylesheet" href="../style.css" />
    <script type="module">
      import '@ascii-web/client';
      const img = document.querySelector('ascii-img')
    </script>
    <style>
      /* controls stay at the top while scrolling */
      fieldset {
        position: sticky;
        top: 0;
        z-index: 1;
        padding-block: var(--space-3);
        background: var(--color-deep);
      }
      figure {
        margin-bottom: var(--space-8);
      }
      figcaption {
        font-size: var(--text-sm);
      }
    </style>
  </head>
  <body>
    <main>
      <h1><a href="../">ascii-web</a> · Infinite scroll</h1>
      <p>
        Photos from
        <a href="https://commons.wikimedia.org/wiki/Category:Quality_images">Wikimedia Commons' quality images</a>,
        used under the license named in each caption.
      </p>

      <fieldset>
        <label>font size (smaller is more detail) <input id="font-size" type="range" min="4" max="24" value="12" /></label>
      </fieldset>

      <div id="feed"></div>
      <div id="more">Loading…</div>
    </main>

    <script type="module">
      const feed = document.querySelector('#feed');
      const more = document.querySelector('#more');
      // the API's token for the next page; null once there are no more
      let next = {};
      let loading = false;

      // apply the font size once it stops changing: each change re-renders
      // every image in the feed
      function debounce(fn, ms = 150) {
        let timer;
        return (e) => {
          clearTimeout(timer);
          timer = setTimeout(() => fn(e), ms);
        };
      }

      // set on the feed, the size is inherited by every image, including ones
      // added later; the slider starts at the stylesheet's size (smaller on phones)
      const fontSize = document.querySelector('#font-size');
      fontSize.value = parseFloat(getComputedStyle(feed).getPropertyValue('--ascii-font-size'));
      fontSize.addEventListener(
        'input',
        debounce((e) => feed.style.setProperty('--ascii-font-size', `${e.target.value}px`)),
      );

      // set src a screen before an image scrolls into view, rather than for
      // every image at once
      const lazy = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            entry.target.setAttribute('src', entry.target.dataset.src);
            lazy.unobserve(entry.target);
          }
        },
        { rootMargin: '100% 0px' },
      );

      // Wikimedia Commons' quality images: photos taken by Commons users,
      // most recently promoted first
      const API = 'https://commons.wikimedia.org/w/api.php';
      const PARAMS = {
        action: 'query',
        format: 'json',
        formatversion: '2',
        origin: '*', // makes the API send CORS headers
        generator: 'categorymembers',
        gcmtitle: 'Category:Quality_images',
        gcmtype: 'file',
        gcmsort: 'timestamp',
        gcmdir: 'desc',
        gcmlimit: '10',
        prop: 'imageinfo',
        iiprop: 'url|size|extmetadata',
        iiurlwidth: '1000',
        iiextmetadatafilter: 'Artist|LicenseShortName',
      };

      // metadata values are HTML (the artist is often a link): keep the text
      const text = (html = '') => new DOMParser().parseFromString(html, 'text/html').body.textContent.trim();

      // resolves false once there are no more photos
      async function loadPage() {
        if (!next) return false;
        const url = `${API}?${new URLSearchParams({ ...PARAMS, ...next })}`;
        const { query, continue: cont } = await (await fetch(url)).json();
        next = cont ?? null;
        for (const page of query?.pages ?? []) {
          const info = page.imageinfo?.[0];
          if (!info?.thumburl) continue;
          const title = page.title.replace(/^File:/, '').replace(/\.\w+$/, '');
          const artist = text(info.extmetadata?.Artist?.value);
          const license = info.extmetadata?.LicenseShortName?.value;
          const figure = document.createElement('figure');
          const img = document.createElement('ascii-img');
          img.dataset.src = info.thumburl;
          img.setAttribute('alt', title);
          // the art keeps the image's proportions, so reserve them before it
          // loads: no layout shift
          img.style.aspectRatio = `${info.width} / ${info.height}`;
          // most of these are CC BY or BY-SA, which require crediting the author
          // and naming the license
          const caption = document.createElement('figcaption');
          caption.textContent = [title, artist, license].filter(Boolean).join(' · ');
          figure.append(img, caption);
          feed.append(figure);
          lazy.observe(img);
        }
        return true;
      }

      // fetch the next page while the end of the feed is still two screens away
      const end = new IntersectionObserver(
        async ([entry]) => {
          if (!entry.isIntersecting || loading) return;
          loading = true;
          const hasMore = await loadPage();
          loading = false;
          if (!hasMore) {
            end.disconnect();
            more.textContent = 'No more photos';
            return;
          }
          // observing again re-checks: if the end is still near, load another page
          end.unobserve(more);
          end.observe(more);
        },
        { rootMargin: '200% 0px' },
      );
      end.observe(more);
    </script>
  </body>
</html>
