<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resize · ascii-web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono&family=Ubuntu+Mono&display=swap" />
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="../../packages/client/ts/ascii-img.ts"></script>
    <style>
      /* drag the bottom-right corner to resize */
      figure {
        resize: horizontal;
        overflow: hidden;
        width: 40rem;
        max-width: 100%;
        min-width: 8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1><a href="../">ascii-web</a> · Resize</h1>

      <fieldset>
        <label>font size <input id="font-size" type="range" min="4" max="24" value="12" /></label>
        <label>min cols <input id="min-cols" type="number" min="1" value="80" /></label>
        <label>max cols <input id="max-cols" type="number" min="1" value="300" /></label>
      </fieldset>
      <fieldset>
        <label>use your own image (or drop one on the page) <input id="upload" type="file" accept="image/*" /></label>
        <button id="restore">restore</button>
      </fieldset>

      <pre><code id="snippet"></code></pre>

      <figure>
        <ascii-img alt="Portrait of Raffaele"></ascii-img>
      </figure>
    </main>

    <script type="module">
      const img = document.querySelector('ascii-img');
      // new URL(..., import.meta.url) lets Vite include the image in the build
      const profile = new URL('./profile.jpg', import.meta.url).href;
      // the snippet shows a file name rather than the full or blob: URL
      let fileName;

      function show(src, alt, name) {
        fileName = name;
        const previous = img.getAttribute('src');
        img.setAttribute('src', src);
        img.setAttribute('alt', alt);
        // uploads are object URLs, which hold the file in memory until revoked
        if (previous?.startsWith('blob:')) URL.revokeObjectURL(previous);
      }

      function upload(file) {
        if (file?.type.startsWith('image/')) show(URL.createObjectURL(file), file.name, file.name);
      }

      const restore = () => show(profile, 'Portrait of Raffaele', 'profile.jpg');
      restore();
      document.querySelector('#restore').addEventListener('click', restore);
      document.querySelector('#upload').addEventListener('change', (e) => upload(e.target.files[0]));
      document.addEventListener('dragover', (e) => e.preventDefault());
      document.addEventListener('drop', (e) => {
        e.preventDefault();
        upload(e.dataTransfer.files[0]);
      });

      // apply a control once it stops changing, rather than re-rendering on
      // every slider step or keystroke (typing 300 would otherwise set 3, then 30)
      function debounce(fn, ms = 150) {
        let timer;
        return (e) => {
          clearTimeout(timer);
          timer = setTimeout(() => fn(e), ms);
        };
      }

      // start the slider at the stylesheet's size, which is smaller on phones
      const fontSize = document.querySelector('#font-size');
      fontSize.value = parseFloat(getComputedStyle(img).getPropertyValue('--ascii-font-size'));
      fontSize.addEventListener(
        'input',
        debounce((e) => img.style.setProperty('--ascii-font-size', `${e.target.value}px`)),
      );
      for (const name of ['min-cols', 'max-cols']) {
        document.querySelector(`#${name}`).addEventListener(
          'input',
          debounce((e) => img.setAttribute(name, e.target.value)),
        );
      }

      // the markup and CSS that reproduce what's on screen, kept in sync with
      // the element's attributes and style, and with the art it renders
      const snippet = document.querySelector('#snippet');
      function updateSnippet() {
        const cols = img.shadowRoot.querySelector('pre').textContent.indexOf('\n');
        const fontSize = getComputedStyle(img).getPropertyValue('--ascii-font-size').trim();
        snippet.textContent = [
          `<ascii-img src="${fileName}" min-cols="${img.getAttribute('min-cols') ?? 80}" max-cols="${img.getAttribute('max-cols') ?? 300}"></ascii-img>`,
          '',
          '<style>',
          `  ascii-img { --ascii-font-size: ${fontSize}; }`,
          '</style>',
          ...(cols > 0 ? ['', `<!-- rendering ${cols} columns at this width -->`] : []),
        ].join('\n');
      }
      new MutationObserver(updateSnippet).observe(img, { attributes: true });
      new MutationObserver(updateSnippet).observe(img.shadowRoot, { childList: true, subtree: true, characterData: true });
      updateSnippet();
    </script>
  </body>
</html>
